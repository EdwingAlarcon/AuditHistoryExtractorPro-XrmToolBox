name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    # net462 necesita los reference assemblies de .NET Framework, preinstalados en windows-latest.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AuditHistoryExtractorPro.XrmToolBox.sln

      - name: Build (Release)
        run: dotnet build AuditHistoryExtractorPro.XrmToolBox.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/AuditHistoryExtractorPro.XrmToolBox.Core.Tests/AuditHistoryExtractorPro.XrmToolBox.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/AuditHistoryExtractorPro.XrmToolBox.Core.Tests/TestResults/*.trx
